name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-client:
    name: Check Client
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: vault-client -> target
      - name: Check
        working-directory: vault-client
        run: cargo check
      - name: Test
        working-directory: vault-client
        run: cargo test

  check-desktop:
    name: Check Desktop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vault-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: vault-desktop/src-tauri -> target
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf libgtk-3-dev libayatana-appindicator3-dev libasound2-dev \
            ninja-build
          pip install --user meson
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install npm dependencies
        working-directory: vault-desktop
        run: npm ci
      - name: Check frontend
        working-directory: vault-desktop
        run: npm run build
      # Мутационное тестирование: каждый смоук обязан ЛОВИТ подложенную поломку.
      # Мутация, на которой смоук остался зелёным, — дырка в проверках, которую
      # не найдёт ни один обычный тест (20.10.2026: так нашлись девять слабых
      # сценариев за день).
      - name: Mutation testing
        working-directory: vault-desktop
        run: npm run gate:mutations
      # Гигиена текста: иероглифы и битые байты (U+FFFD) в коде, комментариях и
      # документации. За сессию 20.10 это повторилось пять раз (в коммите, в
      # модуле, в журнале, в смоуке, в черновике) — разовый прогон не помогает,
      # помогает гейт в CI. Легитимно: src/locales/zh.js и название языка
      # `language_zh` в выпадающем списке.
      - name: Text hygiene (no CJK, no mojibake)
        working-directory: vault-desktop
        run: npm run gate:hygiene
      # Мутационное тестирование RUST-ядра: тесты крейта обязаны ловить
      # подложенную поломку. Ядро — то, куда W4 переносит решения о протоколе,
      # и до 20.10 его тесты проверялись ТОЛЬКО обычными тестами (а обычный
      # тест не отвечает на вопрос «а он что-то проверяет?»). Гейт уже нашёл
      # три настоящих пробела: тест на переполнение TTL не переполнял, у
      # fingerprint не проверялся формат (его сверяет релей-сервер), а
      # длина ключа голоса не проверялась вовсе.
      - name: Rust mutation testing
        working-directory: vault-desktop
        run: npm run gate:rust-mutations
      # Плотность мутаций: у каждого модуля с логикой есть набор. Список дыр
      # может только сокращаться; новый модуль без набора = регресс.
      - name: Mutation density ratchet
        working-directory: vault-desktop
        run: npm run gate:mutation-density
      # Граница сервисов (ADR-005 W5): карта «фича → будущий сервис» обязана
      # совпадать с кодом, примитивы сервиса — объявлены по факту, а долг
      # «фича тянет чужого владельца состояния» не растёт. Карта без гейта
      # протухает за месяцы и начинает описывать вымышленную архитектуру.
      - name: Service boundary
        working-directory: vault-desktop
        run: npm run gate:service-boundary
      - name: Check Tauri
        working-directory: vault-desktop
        run: npx tauri build
