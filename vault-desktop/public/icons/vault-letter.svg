<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="v-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="v-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="#1e1b4b"/>
  <!-- V letter -->
  <path d="M32 28 L56 100 L64 100 L72 100 L96 28 L80 28 L68 78 L56 28 Z"
        fill="url(#v-grad)" filter="url(#v-glow)"/>
  <!-- Dot accent -->
  <circle cx="64" cy="108" r="4" fill="#6366f1"/>
</svg>
