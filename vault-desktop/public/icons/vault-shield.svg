<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shield-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Shield -->
  <path d="M64 8 L112 28 V60 C112 92 90 114 64 122 C38 114 16 92 16 60 V28 Z"
        fill="url(#shield-grad)" filter="url(#shield-shadow)"/>
  <!-- Inner shield -->
  <path d="M64 16 L104 33 V58 C104 86 86 106 64 113 C42 106 24 86 24 58 V33 Z"
        fill="#1e1b4b" fill-opacity="0.6"/>
  <!-- Lock body -->
  <rect x="48" y="62" width="32" height="26" rx="4" fill="#c7d2fe"/>
  <!-- Lock shackle -->
  <path d="M52 62 V52 C52 44 56 40 64 40 C72 40 76 44 76 52 V62"
        fill="none" stroke="#c7d2fe" stroke-width="5" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="64" cy="72" r="4" fill="#1e1b4b"/>
  <rect x="62" y="74" width="4" height="8" rx="1" fill="#1e1b4b"/>
</svg>
