[workspace]
resolver = "2"
# Оболочка Tauri — отдельный crate со своим target: её сборка требует GUI-стек
# и не должна попадать в `cargo test --workspace` социального ядра.
exclude = ["src-tauri"]
members = [
    "crates/social-model",
    "crates/social-ports",
    "crates/social-ports-impl",
    "crates/social-offline",
    "crates/social-invite",
    "crates/social-manifest",
    "crates/sfera-companion",
    "crates/social-media-kind",
    "crates/social-account",
    "crates/sfera-billing",
    "crates/social-ffi-extra",
    "crates/social-device",
    "crates/social-link",
    "crates/social-repo",
    "crates/social-history",
    "crates/social-bridge",
    "crates/social-ffi-bridge",
    "crates/storage-api",
    "crates/storage-providers",
    "crates/storage-factory",
    "crates/storage-conformance",
    "crates/storage-local",
    "crates/storage-webdav",
    "crates/storage-s3",
    "crates/storage-keychain",
    "crates/storage-yandex",
    "crates/social-media",
    "crates/social-rights",
    "crates/social-contacts",
    "crates/social-audience",
    "crates/social-delivery",
    "crates/social-post",
    "crates/social-feed",
    "crates/social-sync",
    "crates/social-transport",
    "crates/social-profile",
    "crates/social-app",
    "crates/social-ffi",
]

[workspace.package]
edition = "2021"
license = "Proprietary"
publish = false
