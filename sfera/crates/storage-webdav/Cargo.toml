[package]
name = "storage-webdav"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vault Sfera: адаптер хранилища WebDAV (ADR-006 §6, очередь 2)"

[dependencies]
storage-api = { path = "../storage-api" }
async-trait = "0.1"
tokio = { version = "1", features = ["io-util"] }
# Та же версия, что в запущенном мессенджере (vault-desktop/src-tauri).
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"

[dev-dependencies]
storage-conformance = { path = "../storage-conformance" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
