[package]
name = "social-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vault Sfera: тонкий слой Tauri-команд social_* (ADR-006 §9)"

[dependencies]
social-app = { path = "../social-app" }
social-contacts = { path = "../social-contacts" }
social-link = { path = "../social-link" }
social-keys = { path = "../social-keys" }
social-delivery = { path = "../social-delivery" }
social-discussion = { path = "../social-discussion" }
social-profile = { path = "../social-profile" }
social-upload = { path = "../social-upload" }
social-media-kind = { path = "../social-media-kind" }
social-manifest = { path = "../social-manifest" }
social-library = { path = "../social-library" }
social-post = { path = "../social-post" }
social-public = { path = "../social-public" }
social-paid = { path = "../social-paid" }
social-rights = { path = "../social-rights" }
storage-api = { path = "../storage-api" }
base64 = "0.22"
hex = "0.4"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# Минимальный Tauri: только макрос #[tauri::command] и IPC-типы, без wry/GTK.
# Те же функции вызываются напрямую в тестах — GUI-рантайм не нужен.
tauri = { version = "2", default-features = false }
social-sync = { path = "../social-sync" }
storage-local = { path = "../storage-local" }
social-model = { path = "../social-model" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "public-sync"
path = "src/bin/public_sync.rs"
