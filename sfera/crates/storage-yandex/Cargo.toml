[package]
name = "storage-yandex"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vault Sfera: Яндекс Диск через OAuth + WebDAV-транспорт (ADR-006 §6, очередь 4)"

[dependencies]
storage-api = { path = "../storage-api" }
storage-webdav = { path = "../storage-webdav" }
storage-keychain = { path = "../storage-keychain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
storage-conformance = { path = "../storage-conformance" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
