[package]
name = "social-library"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vault Sfera: локальный каталог своих медиа с ключами (ADR-006 §5.2)"

[dev-dependencies]
tempfile = "3"

[dependencies]
social-upload = { path = "../social-upload" }
social-media-kind = { path = "../social-media-kind" }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
