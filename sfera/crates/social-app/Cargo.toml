[package]
name = "social-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vault Sfera: композиционный корень — только сборка портов (ADR-006 §9)"

[dependencies]
social-model = { path = "../social-model" }
social-rights = { path = "../social-rights" }
social-contacts = { path = "../social-contacts" }
social-audience = { path = "../social-audience" }
social-post = { path = "../social-post" }
social-feed = { path = "../social-feed" }
social-profile = { path = "../social-profile" }
social-sync = { path = "../social-sync" }
storage-api = { path = "../storage-api" }

[dev-dependencies]
storage-local = { path = "../storage-local" }
storage-conformance = { path = "../storage-conformance" }
social-media = { path = "../social-media" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sha2 = "0.10"
hex = "0.4"
