[package]
name = "storage-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vault Sfera: порт хранилища блобов и общие типы (ADR-006 §6)"

[dependencies]
# Асинхронный порт остаётся dyn-совместимым: фичи держат Arc<dyn BlobStore>,
# а не конкретный адаптер провайдера (ADR-006 §6).
async-trait = "0.1"
tokio = { version = "1", features = ["io-util"] }
serde = { version = "1", features = ["derive"] }
hex = "0.4"

[dev-dependencies]
serde_json = "1"
