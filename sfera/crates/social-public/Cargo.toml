[package]
name = "social-public"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
social-paid = { path = "../social-paid" }
social-post = { path = "../social-post" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[[bin]]
name = "social-public-serve"
path = "src/bin/serve.rs"

[dev-dependencies]
tempfile = "3"
social-rights = { path = "../social-rights" }
