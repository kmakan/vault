[package]
name = "social-feed"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vault Sfera: локальная лента — дедуп, порядок, read-state (ADR-006 §7)"

[dependencies]
social-post = { path = "../social-post" }
# post_id = SHA-256 канонического JCS поста: стабилен между устройствами.
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
social-model = { path = "../social-model" }
social-rights = { path = "../social-rights" }
