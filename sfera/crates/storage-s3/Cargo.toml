[package]
name = "storage-s3"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vault Sfera: S3-совместимый адаптер (Selectel/VK Cloud/MinIO), ADR-006 §6"

[dependencies]
storage-api = { path = "../storage-api" }
async-trait = "0.1"
tokio = { version = "1", features = ["io-util"] }
# Те же версии, что уже в Sfera/мессенджере — без рассинхрона.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
percent-encoding = "2.3"

[dev-dependencies]
storage-conformance = { path = "../storage-conformance" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
