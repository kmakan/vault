[package]
name = "storage-local"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vault Sfera: адаптер хранилища «папка устройства» (ADR-006 §6, очередь 1)"

[dependencies]
storage-api = { path = "../storage-api" }
async-trait = "0.1"
tokio = { version = "1", features = ["fs", "io-util"] }
sha2 = "0.10"

[dev-dependencies]
storage-conformance = { path = "../storage-conformance" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
