[package]
name = "social-media"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vault Sfera: формат блоба, чанкованный XChaCha20-Poly1305, миниатюры (ADR-006 §5)"

[dependencies]
storage-api = { path = "../storage-api" }
# Тот же XChaCha20-Poly1305 (RustCrypto), что уже стоит в vault-core; второй
# шифр не изобретаем. Все протокольные решения — здесь, в Rust.
chacha20poly1305 = "0.10"
aead = { version = "0.5", features = ["alloc"] }
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
hex = "0.4"

[dev-dependencies]
serde_json = "1"
hex = "0.4"
