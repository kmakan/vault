[package]
name = "social-upload"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vault Sfera: загрузка зашифрованного медиа в BlobStore (ADR-006 §5)"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
serde_json = "1"
storage-local = { path = "../storage-local" }

[dependencies]
storage-api = { path = "../storage-api" }
social-media = { path = "../social-media" }
social-manifest = { path = "../social-manifest" }
social-media-kind = { path = "../social-media-kind" }
serde = { version = "1", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"
# Только декодирование/уменьшение картинки для миниатюры. Форматы — те, что
# реально приходят с телефонов; HEIC/AVIF сознательно не тянем (нет миниатюры,
# полный файл всё равно доступен).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
