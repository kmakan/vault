[package]
name = "social-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vault Sfera: outbox с ретраями, квоты и идемпотентная вставка в ленту (ADR-006 §7.1)"

[dependencies]
social-feed = { path = "../social-feed" }
social-post = { path = "../social-post" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
social-model = { path = "../social-model" }
social-rights = { path = "../social-rights" }
serde_json = "1"
