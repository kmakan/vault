[package]
name = "social-discussion"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vault Sfera: подписанные комментарии и реакции, локальная агрегация (ADR-006 §14)"

[dependencies]
social-model = { path = "../social-model" }
social-post = { path = "../social-post" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"

[dev-dependencies]
serde_json = "1"
social-rights = { path = "../social-rights" }
