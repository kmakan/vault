[package]
name = "social-profile"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vault Sfera: профиль, аватар, ссылки — подпись в отдельном домене (ADR-006 §7.6)"

[dependencies]
social-model = { path = "../social-model" }
storage-api = { path = "../storage-api" }
serde = { version = "1", features = ["derive"] }
# profile_id: SHA-256 от публичного ключа автора (домен отделён от подписи).
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
serde_json = "1"
