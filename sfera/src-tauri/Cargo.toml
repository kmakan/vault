[package]
name = "sfera"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
publish = false
description = "Vault Sfera — оболочка Tauri: десктоп и мобильные, логика в Rust"

[lib]
name = "sfera_app"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
social-app = { path = "../crates/social-app" }
social-ffi = { path = "../crates/social-ffi" }
social-ffi-bridge = { path = "../crates/social-ffi-bridge" }
social-ffi-extra = { path = "../crates/social-ffi-extra" }
social-sync = { path = "../crates/social-sync" }
storage-local = { path = "../crates/storage-local" }
vault-core = { path = "../../vault-core" }
dirs = "5"
