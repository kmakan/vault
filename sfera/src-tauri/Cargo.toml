[package]
name = "sfera"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
publish = false
description = "Vault Sfera — оболочка Tauri: десктоп и мобильные, логика в Rust"

[lib]
name = "sfera_app"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
social-app = { path = "../crates/social-app" }
social-link = { path = "../crates/social-link" }
social-keys = { path = "../crates/social-keys" }
social-ffi = { path = "../crates/social-ffi" }
social-ffi-bridge = { path = "../crates/social-ffi-bridge" }
social-ffi-extra = { path = "../crates/social-ffi-extra" }
social-sync = { path = "../crates/social-sync" }
storage-local = { path = "../crates/storage-local" }
vault-client = { path = "../../vault-client" }
tokio = { version = "1", features = ["rt", "time"] }
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls"] }
native-tls = "0.2"
social-delivery = { path = "../crates/social-delivery" }
rand = "0.8"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
social-profile = { path = "../crates/social-profile" }
