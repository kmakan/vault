[package]
name = "vault-relay"
version = "0.1.0"
edition = "2021"
description = "Vault push-relay: pub/sub over opaque tokens, no user data"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
# sha2/oid: rsa::pkcs1v15::SigningKey требует AssociatedOid у хэша (RS256).
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
# FCM Part B: подпись JWT (RS256) и HTTPS-обмен с fcm.googleapis.com
# (у ntfy — plain HTTP на локальный сокет, у FCM — только https/TLS).
rsa = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
tower-http = { version = "0.5", features = ["cors"] }

[profile.release]
lto = true
strip = true
