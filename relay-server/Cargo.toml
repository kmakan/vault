[package]
name = "vault-relay"
version = "0.1.0"
edition = "2021"
description = "Vault push-relay: pub/sub over opaque tokens, no user data"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = true
strip = true
