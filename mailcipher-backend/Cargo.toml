[package]
name = "mailcipher-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full", "macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "normalize-path", "util"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
config = "0.13"
dotenvy = "0.15"

# Authentication
jsonwebtoken = "9"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "v7", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }

# Email
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }
async-imap = "0.9"
tokio-native-tls = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }

# Crypto
rand = "0.8"
rand_core = "0.6"
zeroize = "1.8"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
pqc_kyber = { version = "0.7", default-features = false, features = ["kyber1024", "std"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
once_cell = "1.19"
bytes = "1"
http = "1.0"
url = "2"
async-trait = "0.1"
futures = "0.3"

# Push notifications
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
web-push = "0.10"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full", "macros", "test-util"] }
